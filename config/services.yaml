parameters:
    app.timezone: UTC
    app.locale: es
    env(DATABASE_URL): 'sqlite:///%kernel.project_dir%/var/data.db'
    env(MAILER_DSN): 'null://null'
    env(APP_SECRET): 'test-only-not-a-production-secret'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
