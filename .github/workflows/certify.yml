name: certify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    name: C1–C7 kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Install and test clarity/nucleo
        working-directory: packages/clarity-nucleo
        run: |
          composer install --no-interaction --prefer-dist
          composer test

  product:
    name: P1–P3 require
    runs-on: ubuntu-latest
    needs: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: ctype, iconv
      - name: Require path package
        run: composer update clarity/nucleo --no-interaction --prefer-dist --no-scripts
      - name: Product nucleo tests
        run: php bin/phpunit tests/Nucleo
